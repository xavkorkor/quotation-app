<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AUA Quotation WhatsApp Text</title><style>*{box-sizing:border-box}:root{--dark:#1f2937;--bg:#f4f5f7;--wa:#25D366}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#181818;padding-bottom:90px}main{max-width:720px;margin:auto;padding:12px}.topnav{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:12;background:var(--bg);padding:4px 0 8px}.topnav a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:#fff;border:1px solid #d8dde3;color:#222;font-weight:700}.topnav a.active{background:var(--dark);color:#fff}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:12px}h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:5px 0 10px}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}input,textarea,select{width:100%;font:inherit;font-size:16px;min-height:46px;padding:10px;border:1px solid #cfd3d8;border-radius:9px;background:#fff}textarea{min-height:72px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.opts label{display:flex;align-items:center;gap:8px;font-size:13px}.opts input{width:18px;min-height:18px}.secCard{background:#fff;border:1px solid #ddd;border-radius:14px;margin-bottom:12px;overflow:hidden}.secTop{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:10px;border-bottom:1px solid #eee;background:#fafafa}.secActions{display:flex;gap:5px}.items{padding:8px 10px 10px}.itemBlock{border-bottom:1px solid #f0f0f0;padding-bottom:7px;margin-bottom:7px}.row{display:grid;grid-template-columns:44px 1fr 86px 36px;gap:5px;margin-top:6px}.row input{padding:7px 5px;min-height:42px}.discountRow{display:grid;grid-template-columns:1fr 86px 1fr;gap:5px;margin:5px 41px 0 49px;align-items:center}.discountRow .discLabel{font-size:11px;color:#667085}.discountRow select,.discountRow input{font-size:14px;min-height:38px;padding:6px}.sectionDiscount{display:grid;grid-template-columns:1fr 88px 1fr;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #eee}.sectionDiscount span{font-size:12px;font-weight:700}.sectionDiscount select,.sectionDiscount input{font-size:14px;min-height:40px;padding:7px}.overallDiscount{display:grid;grid-template-columns:1fr 90px 1fr;gap:7px;align-items:end}.btn{border:0;border-radius:9px;padding:11px 12px;font-weight:700;font-size:14px}.smallBtn{padding:8px 9px;min-width:36px}.gray{background:#e9edf2}.red{background:#fee2e2;color:#991b1b}.wa{background:var(--wa);color:#fff}.dark{background:var(--dark);color:#fff}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tools .btn{flex:1}.addItemSticky{position:sticky;bottom:80px;width:100%;margin-top:8px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.bar{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1.2fr 1fr;gap:8px;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#fff;border-top:1px solid #ddd;z-index:20}.bar .btn{min-height:54px}.previewbox{white-space:pre-wrap;font-size:15px;line-height:1.48;min-height:180px;background:#fcfcfd;border:1px dashed #cfd3d8;border-radius:10px;padding:12px}.hint{font-size:11px;color:#667085;margin-top:4px;line-height:1.4}@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:1fr}.wide{grid-column:1}.row{grid-template-columns:40px minmax(0,1fr) 78px 34px}.discountRow{grid-template-columns:1fr 72px 1fr;margin-left:45px;margin-right:39px}.sectionDiscount{grid-template-columns:1fr 76px 1fr}.overallDiscount{grid-template-columns:1fr 76px 1fr}.secTop{grid-template-columns:1fr}.secActions{justify-content:flex-end}.topnav a{padding:10px 7px;font-size:13px}}</style></head><body><main><div class="topnav"><a href="mobile-pdf-discounts.html">PDF Quotation</a><a class="active" href="mobile-text-discounts.html">WhatsApp Text</a></div><div class="card"><div class="grid"><div><label>Customer Name</label><input id="customer" autocomplete="name"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Vehicle No.</label><input id="vehicle" autocapitalize="characters"></div><div><label>Mileage</label><input id="mileage" inputmode="numeric"></div><div class="wide"><label>Model / Type</label><input id="model"></div><div class="wide"><label>WhatsApp No. <span style="font-weight:400">(optional)</span></label><input id="phone" inputmode="tel" placeholder="e.g. 91234567"><div class="hint">Saved on this phone. Leave blank to choose a contact in WhatsApp.</div></div><div class="wide"><label>Intro Message</label><textarea id="intro">Hi, please see our quotation below. Thank you.</textarea></div></div></div><div class="card opts"><label><input id="gstOn" type="checkbox" checked> Include GST (9%)</label></div><h2>Quotation Sections</h2><div id="sections"></div><div class="card"><h2>Overall Discount</h2><div class="overallDiscount"><div><label>Discount</label><input id="overallDisc" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Blank = none"></div><div><label>Type</label><select id="overallDiscType"><option value="amount">S$</option><option value="percent">%</option></select></div><div class="hint">Applied after item and section discounts, before GST.</div></div></div><div class="tools"><button class="btn gray" onclick="addSection()">+ Section</button><button class="btn gray" onclick="clearAll()">New</button></div><div class="card"><h2>WhatsApp Text Preview</h2><div id="textPreview" class="previewbox"></div></div></main><div class="bar"><button class="btn wa" onclick="openWhatsApp()">Open WhatsApp</button><button class="btn dark" onclick="nativeShareText()">Share / Copy</button></div><script>const $=x=>document.getElementById(x),S=[],money=n=>n===''||n==null?'':Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function discAmt(base,val,type){const v=Math.max(0,Number(val)||0);return Math.min(base,type==='percent'?base*Math.min(v,100)/100:v)}function discLabel(val,type){const v=Number(val)||0;return type==='percent'?`${v}%`:`S$${money(v)}`}function sec(){return{title:'REPAIR / SERVICE',collapsed:false,disc:'',discType:'amount',items:[{q:1,d:'',p:'',disc:'',discType:'amount'}]}}function addSection(){S.push(sec());render();upd()}function delS(i){S.splice(i,1);if(!S.length)S.push(sec());render();upd()}function toggleS(i){S[i].collapsed=!S[i].collapsed;render()}function addI(i){let a=S[i].items,q=a.length?a[a.length-1].q:1;a.push({q,d:'',p:'',disc:'',discType:'amount'});S[i].collapsed=false;render();setTimeout(()=>document.querySelector(`[data-d="${i}-${a.length-1}"]`)?.focus(),0);upd()}function delI(i,j){S[i].items.splice(j,1);if(!S[i].items.length)S[i].items.push({q:1,d:'',p:'',disc:'',discType:'amount'});render();upd()}function key(e,i,j){if((e.key==='Enter'||e.key==='Tab')&&!e.shiftKey){e.preventDefault();let q=S[i].items[j].q;S[i].items.splice(j+1,0,{q,d:'',p:'',disc:'',discType:'amount'});render();setTimeout(()=>document.querySelector(`[data-d="${i}-${j+1}"]`)?.focus(),0);upd()}}function render(){sections.innerHTML=S.map((s,i)=>`<div class="secCard"><div class="secTop"><input value="${esc(s.title)}" oninput="S[${i}].title=this.value;upd()"><div class="secActions"><button class="btn gray smallBtn" onclick="toggleS(${i})">${s.collapsed?'▾':'▴'}</button><button class="btn red smallBtn" onclick="delS(${i})">×</button></div></div><div class="items" style="${s.collapsed?'display:none':''}">${s.items.map((x,j)=>`<div class="itemBlock"><div class="row"><input type="number" value="${x.q}" inputmode="numeric" oninput="S[${i}].items[${j}].q=this.value;upd()"><input data-d="${i}-${j}" value="${esc(x.d)}" placeholder="Description" oninput="S[${i}].items[${j}].d=this.value;upd()"><input type="number" step=".01" value="${x.p}" inputmode="decimal" placeholder="Price" oninput="S[${i}].items[${j}].p=this.value;upd()" onkeydown="key(event,${i},${j})"><button class="btn red smallBtn" onclick="delI(${i},${j})">×</button></div><div class="discountRow"><span class="discLabel">Item discount</span><select onchange="S[${i}].items[${j}].discType=this.value;upd()"><option value="amount" ${x.discType==='amount'?'selected':''}>S$</option><option value="percent" ${x.discType==='percent'?'selected':''}>%</option></select><input type="number" min="0" step="0.01" value="${x.disc}" inputmode="decimal" placeholder="None" oninput="S[${i}].items[${j}].disc=this.value;upd()"></div></div>`).join('')}<div class="sectionDiscount"><span>Section discount</span><select onchange="S[${i}].discType=this.value;upd()"><option value="amount" ${s.discType==='amount'?'selected':''}>S$</option><option value="percent" ${s.discType==='percent'?'selected':''}>%</option></select><input type="number" min="0" step="0.01" value="${s.disc}" inputmode="decimal" placeholder="None" oninput="S[${i}].disc=this.value;upd()"></div><button class="btn gray addItemSticky" onclick="addI(${i})">+ Add Item</button></div></div>`).join('')}function calc(){let afterSections=0;const details=S.map(s=>{let afterItems=0;const items=s.items.map(x=>{const gross=x.q!==''&&x.p!==''?(+x.q||0)*(+x.p||0):0,id=discAmt(gross,x.disc,x.discType);afterItems+=gross-id;return{...x,gross,id,net:gross-id}});const sd=discAmt(afterItems,s.disc,s.discType),net=afterItems-sd;afterSections+=net;return{s,items,afterItems,sd,net}});const od=discAmt(afterSections,overallDisc.value,overallDiscType.value),taxable=afterSections-od,g=gstOn.checked?taxable*.09:0;return{details,afterSections,od,taxable,g,grand:taxable+g}}function textQ(){const c=calc(),L=[],introText=(intro.value||'').trim();if(introText)L.push(introText,'');L.push("*ALAN'S UNITED AUTO PTE. LTD.*","*QUOTATION*");if(customer.value)L.push(`Customer: ${customer.value}`);if(vehicle.value)L.push(`Vehicle: ${vehicle.value.toUpperCase()}`);if(model.value)L.push(`Model: ${model.value}`);if(mileage.value)L.push(`Mileage: ${mileage.value}`);if(date.value)L.push(`Date: ${new Date(date.value+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`);L.push('');c.details.forEach(d=>{L.push(`*${d.s.title.toUpperCase()}*`);d.items.forEach(x=>{if(!x.d&&!x.p)return;L.push(`• ${x.q!==''?x.q+' x ':''}${x.d}${x.p!==''?' @ S$'+money(x.p):''}${x.gross?' = S$'+money(x.gross):''}`);if(x.id>0)L.push(`  Less item discount ${discLabel(x.disc,x.discType)}: -S$${money(x.id)} → S$${money(x.net)}`)});if(d.sd>0)L.push(`Less section discount ${discLabel(d.s.disc,d.s.discType)}: -S$${money(d.sd)}`);if(d.net)L.push(`Section: S$${money(d.net)}`);L.push('')});if(c.afterSections){L.push(`Subtotal: S$${money(c.afterSections)}`);if(c.od>0)L.push(`Overall discount ${discLabel(overallDisc.value,overallDiscType.value)}: -S$${money(c.od)}`);if(gstOn.checked)L.push(`GST (9%): S$${money(c.g)}`);L.push(`*Grand Total: S$${money(c.grand)}*`)}L.push('','Quotation valid for 7 days.','Ad hoc items may be required.');return L.join('\n')}function upd(){vehicle.value=vehicle.value.toUpperCase();textPreview.textContent=textQ();localStorage.setItem('aua_mobile_phone',phone.value||'');localStorage.setItem('aua_mobile_intro',intro.value||'')}function norm(v){let n=String(v||'').replace(/\D/g,'');if(!n)return'';return n.length===8?'65'+n:n}function openWhatsApp(){const n=norm(phone.value),u=n?`https://wa.me/${n}?text=${encodeURIComponent(textQ())}`:`https://wa.me/?text=${encodeURIComponent(textQ())}`;location.href=u}async function nativeShareText(){const t=textQ();if(navigator.share){try{await navigator.share({title:`Quotation - ${vehicle.value||customer.value||"Alan's United"}`,text:t});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(t);alert('Quotation text copied.')}catch{openWhatsApp()}}function clearAll(){if(!confirm('Start a new quotation?'))return;customer.value=vehicle.value=mileage.value=model.value=overallDisc.value='';overallDiscType.value='amount';date.value=new Date().toISOString().slice(0,10);S.splice(0,S.length,sec());render();upd();customer.focus()}[customer,date,vehicle,mileage,model,phone,intro,gstOn,overallDisc,overallDiscType].forEach(x=>x.addEventListener('input',upd));date.value=new Date().toISOString().slice(0,10);phone.value=localStorage.getItem('aua_mobile_phone')||'';intro.value=localStorage.getItem('aua_mobile_intro')||'Hi, please see our quotation below. Thank you.';S.push(sec());render();upd();customer.focus();</script></body></html>
