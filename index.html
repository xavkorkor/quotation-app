<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alan's United Quotation App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f4;color:#181818}
.app{display:grid;grid-template-columns:430px minmax(0,1fr);min-height:100vh}
.editor{background:#fff;border-right:1px solid #ddd;padding:22px;height:100vh;overflow:auto;position:sticky;top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;color:#444;margin-bottom:4px}
input{width:100%;border:1px solid #cfd3d8;border-radius:8px;padding:9px;font:inherit;background:#fff}
.option-card{margin-top:14px;padding:11px 12px;border:1px solid #d7dce2;border-radius:10px;background:#f8fafc}
.option-card label{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px}
.option-card label:last-child{margin-bottom:0}
.option-card input[type=checkbox]{width:17px;height:17px}
h2{font-size:14px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.section-card{border:1px solid #ddd;border-radius:10px;padding:10px;margin:10px 0;background:#fafafa}
.section-head{display:grid;grid-template-columns:1fr 34px;gap:6px}
.item-row{display:grid;grid-template-columns:52px 1fr 88px 34px;gap:6px;margin-top:6px}
button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}
.primary{background:#1f2937;color:white}
.secondary{background:#e9edf2}
.danger{background:#fee2e2;color:#991b1b}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:#667085;margin:-5px 0 10px}
.preview-wrap{padding:28px;overflow:auto}
.paper{width:210mm;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.15);padding:0 18mm 16mm}
.header-img{display:block;width:100%;height:auto;max-width:100%;margin:0 auto 3mm}
.paper.no-header{padding-top:18mm}
.quote-title{text-align:center;font-size:21px;font-weight:700;letter-spacing:.28em;margin:0 0 8mm;padding-left:.28em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 16mm;margin:0 4mm 7mm;font-size:11.5px}
.meta-line{display:grid;grid-template-columns:31mm 1fr;gap:3mm;padding:1.2mm 0;border-bottom:1px solid #eee}
.meta-label{font-weight:700;color:#555}
.table-head,.line-item{display:grid;grid-template-columns:16mm 1fr 31mm 31mm;column-gap:3mm;align-items:start}
.table-head{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2.3mm 1mm;border-top:1px solid #333;border-bottom:1px solid #bbb}
.quote-section{margin-top:4mm;break-inside:avoid;page-break-inside:avoid}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 1mm 1.5mm}
.line-item{font-size:10.5px;padding:2mm 1mm;border-bottom:1px solid #eee}
.num{text-align:right;white-space:nowrap}
.section-subtotal{display:grid;grid-template-columns:16mm 1fr 31mm 31mm;column-gap:3mm;font-size:10.5px;font-weight:700;padding:2mm 1mm 3mm;border-top:1px solid #bbb}
.section-subtotal .section-amount{grid-column:4;text-align:right;white-space:nowrap}
.section-summary{margin-top:9mm;border-top:1px solid #222}
.summary-head,.summary-row{display:grid;grid-template-columns:1fr 36mm;gap:4mm;padding:2mm}
.summary-head{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #bbb}
.summary-row{font-size:10.5px;border-bottom:1px solid #eee}
.summary-total{font-weight:700;border-top:1px solid #333}
.totals{width:72mm;margin:8mm 0 0 auto;font-size:11px}
.total-row{display:grid;grid-template-columns:1fr 30mm;padding:1.8mm 3mm;border-bottom:1px solid #ddd}
.grand{font-weight:700;font-size:12px;border-top:1px solid #222;border-bottom:3px double #222}
.notes{margin-top:14mm;font-size:9.5px;line-height:1.6}
@media(max-width:1100px){.app{grid-template-columns:1fr}.editor{height:auto;position:relative}.preview-wrap{padding:10px}}
@media print{
body{background:#fff}
.editor{display:none}
.app{display:block}
.preview-wrap{padding:0}
.paper{box-shadow:none;margin:0;width:210mm;min-height:289mm;padding-bottom:12mm}
.quote-section,.section-summary,.totals{break-inside:avoid;page-break-inside:avoid}
@page{size:A4;margin:0 0 8mm 0;@bottom-center{content:"Page " counter(page) " of " counter(pages);font-family:Arial,Helvetica,sans-serif;font-size:9px;color:#777}}
}
</style>
</head>
<body>
<div class="app">
<div class="editor">
<div class="grid">
<div><label>Customer Name</label><input id="customer"></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Vehicle No.</label><input id="vehicle"></div>
<div><label>Mileage</label><input id="mileage"></div>
<div style="grid-column:1/-1"><label>Model / Type</label><input id="model"></div>
</div>
<div class="option-card">
<label><input id="useHeader" type="checkbox" checked> Use original Alan's United header</label>
<label><input id="includeGst" type="checkbox" checked> Include GST (9%)</label>
<label><input id="showSectionSummary" type="checkbox"> Show section summary</label>
</div>
<h2>Quotation Sections</h2>
<div class="hint">Press Enter or Tab after Unit Price to add the next item automatically.</div>
<div id="sections"></div>
<div class="toolbar">
<button class="secondary" onclick="addSection()">+ Add Section</button>
<button class="secondary" onclick="newQuotation()">New / Clear</button>
<button class="primary" onclick="printPdf()">Print / Save PDF</button>
</div>
<div class="toolbar">
<button class="secondary" onclick="saveData()">Save Quotation File</button>
<button class="secondary" onclick="loadFile.click()">Open Quotation File</button>
<input id="loadFile" type="file" accept=".json" hidden>
</div>
</div>
<div class="preview-wrap">
<div class="paper" id="paper">

<div class="quote-title">QUOTATION</div>
<div class="meta"><div><div class="meta-line"><span class="meta-label">Customer Name</span><span id="pCustomer"></span></div><div class="meta-line"><span class="meta-label">Vehicle No.</span><span id="pVehicle"></span></div><div class="meta-line"><span class="meta-label">Model / Type</span><span id="pModel"></span></div></div><div><div class="meta-line"><span class="meta-label">Date</span><span id="pDate"></span></div><div class="meta-line"><span class="meta-label">Mileage</span><span id="pMileage"></span></div></div></div>
<div class="table-head"><div>Qty</div><div>Description</div><div class="num">Unit Price</div><div class="num">Amount</div></div>
<div id="pSections"></div><div id="sectionSummary" class="section-summary"></div><div class="totals"><div class="total-row"><b>Subtotal</b><span class="num" id="subtotal"></span></div><div class="total-row" id="gstRow"><span>GST (9%)</span><span class="num" id="gst"></span></div><div class="total-row grand"><span>GRAND TOTAL</span><span class="num" id="grand"></span></div></div><div class="notes">Quotation valid for 7 days.<br>Ad hoc items may be required.</div>
</div></div></div>
<script>
const $=id=>document.getElementById(id);const sections=[];const money=n=>(n===null||n===undefined||n==='')?'':Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function blankSection(title='REPAIR / SERVICE'){return {title,items:[{qty:1,desc:'',price:''}]}}function addSection(title='REPAIR / SERVICE',items=null){sections.push({title,items:items||[{qty:1,desc:'',price:''}]});renderEditor();update()}function removeSection(i){sections.splice(i,1);if(!sections.length)sections.push(blankSection());renderEditor();update()}function addItem(si){const items=sections[si].items;const qty=items.length?(items[items.length-1].qty??1):1;items.push({qty,desc:'',price:''});renderEditor();update();focusItem(si,items.length-1)}function addItemAfter(si,ii){const qty=sections[si].items[ii]?.qty??1;sections[si].items.splice(ii+1,0,{qty,desc:'',price:''});renderEditor();update();focusItem(si,ii+1)}function removeItem(si,ii){sections[si].items.splice(ii,1);if(!sections[si].items.length)sections[si].items.push({qty:1,desc:'',price:''});renderEditor();update()}function focusItem(si,ii){requestAnimationFrame(()=>{const el=document.querySelector(`[data-item-desc="${si}-${ii}"]`);if(el){el.focus();el.select()}})}function itemKeydown(e,si,ii){if((e.key==='Enter'||e.key==='Tab')&&!e.shiftKey){e.preventDefault();addItemAfter(si,ii)}}
function renderEditor(){sectionsEl.innerHTML=sections.map((s,si)=>`<div class="section-card"><div class="section-head"><input value="${esc(s.title)}" oninput="sections[${si}].title=this.value;update()"><button class="danger" onclick="removeSection(${si})">×</button></div>${s.items.map((it,ii)=>`<div class="item-row"><input type="number" min="0" step="1" value="${it.qty}" oninput="sections[${si}].items[${ii}].qty=this.value;update()"><input data-item-desc="${si}-${ii}" value="${esc(it.desc)}" placeholder="Description" oninput="sections[${si}].items[${ii}].desc=this.value;update()"><input type="number" min="0" step="0.01" value="${it.price}" oninput="sections[${si}].items[${ii}].price=this.value;update()" onkeydown="itemKeydown(event,${si},${ii})"><button class="danger" onclick="removeItem(${si},${ii})">×</button></div>`).join('')}<button class="secondary" style="margin-top:8px" onclick="addItem(${si})">+ Item</button></div>`).join('')}
function update(){headerImage.style.display=useHeader.checked?'block':'none';paper.classList.toggle('no-header',!useHeader.checked);pCustomer.textContent=customer.value;pVehicle.textContent=vehicle.value;pModel.textContent=model.value;pMileage.textContent=mileage.value;pDate.textContent=date.value?new Date(date.value+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';let subtotalValue=0,hasAny=false;const sectionTotals=[];pSections.innerHTML=sections.map(s=>{let sectionTotal=0,sectionHas=false;const rows=s.items.map(it=>{const hasQty=it.qty!==''&&it.qty!=null;const hasPrice=it.price!==''&&it.price!=null;let amount='';if(hasQty&&hasPrice){amount=(+it.qty||0)*(+it.price||0);sectionTotal+=amount;subtotalValue+=amount;sectionHas=true;hasAny=true}return `<div class="line-item"><div>${esc(it.qty)}</div><div>${esc(it.desc)}</div><div class="num">${money(it.price)}</div><div class="num">${money(amount)}</div></div>`}).join('');sectionTotals.push({title:s.title,total:sectionTotal,hasAmount:sectionHas});const sum=sectionHas?`<div class="section-subtotal"><div class="section-amount">S$ ${money(sectionTotal)}</div></div>`:'';return `<div class="quote-section"><div class="section-title">${esc(s.title)}</div>${rows}${sum}</div>`}).join('');const summaryRows=sectionTotals.filter(x=>x.hasAmount).map(x=>`<div class="summary-row"><div>${esc(x.title)}</div><div class="num">S$ ${money(x.total)}</div></div>`).join('');sectionSummary.innerHTML=showSectionSummary.checked&&summaryRows?`<div class="summary-head"><div>Section Summary</div><div class="num">Amount</div></div>${summaryRows}<div class="summary-row summary-total"><div>TOTAL OF ALL SECTIONS</div><div class="num">S$ ${money(subtotalValue)}</div></div>`:'';const gstValue=hasAny&&includeGst.checked?subtotalValue*.09:'';subtotal.textContent=hasAny?'S$ '+money(subtotalValue):'';gst.textContent=hasAny&&includeGst.checked?'S$ '+money(gstValue):'';grand.textContent=hasAny?'S$ '+money(subtotalValue+(includeGst.checked?Number(gstValue):0)):'';gstRow.style.display=includeGst.checked?'grid':'none'}
function collect(){return {customer:customer.value,date:date.value,vehicle:vehicle.value,mileage:mileage.value,model:model.value,useHeader:useHeader.checked,includeGst:includeGst.checked,showSectionSummary:showSectionSummary.checked,sections}}function safeName(v){return String(v||'').trim().replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'')}function baseFileName(){return `${safeName(customer.value)||'Customer'}_${safeName(vehicle.value)||'Vehicle'}`}function saveData(){const blob=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=baseFileName()+'.json';a.click();URL.revokeObjectURL(a.href)}function printPdf(){const old=document.title;document.title=baseFileName();window.print();setTimeout(()=>document.title=old,1000)}function newQuotation(){if(!confirm('Clear the current quotation and start a new one?'))return;customer.value='';vehicle.value='';mileage.value='';model.value='';date.value=new Date().toISOString().slice(0,10);useHeader.checked=true;includeGst.checked=true;showSectionSummary.checked=false;sections.splice(0,sections.length,blankSection());renderEditor();update();requestAnimationFrame(()=>customer.focus())}
loadFile.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);customer.value=d.customer||'';date.value=d.date||new Date().toISOString().slice(0,10);vehicle.value=d.vehicle||'';mileage.value=d.mileage||'';model.value=d.model||'';useHeader.checked=d.useHeader!==false;includeGst.checked=d.includeGst!==false;showSectionSummary.checked=!!d.showSectionSummary;sections.splice(0,sections.length,...(d.sections?.length?d.sections:[blankSection()]));renderEditor();update()}catch{alert('Unable to open quotation file.')}};r.readAsText(f);e.target.value=''});[customer,date,vehicle,mileage,model].forEach(el=>el.addEventListener('input',update));[useHeader,includeGst,showSectionSummary].forEach(el=>el.addEventListener('change',update));document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='n'){e.preventDefault();newQuotation()}if(k==='s'){e.preventDefault();saveData()}if(k==='p'){e.preventDefault();printPdf()}});const sectionsEl=$('sections');date.value=new Date().toISOString().slice(0,10);sections.push(blankSection());renderEditor();update();requestAnimationFrame(()=>customer.focus());
</script></body></html>
