<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AUA Quotation Text</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#181818;padding-bottom:86px}main{max-width:720px;margin:auto;padding:14px}.topnav{display:flex;gap:8px;margin-bottom:12px}.topnav a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:#fff;border:1px solid #d8dde3;color:#222;font-weight:700}.topnav a.active{background:#1f2937;color:#fff}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px}h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:5px 0 10px}label{font-size:12px;font-weight:700;display:block;margin:8px 0 4px}input,textarea{width:100%;font:inherit;font-size:16px;min-height:44px;padding:9px;border:1px solid #cfd3d8;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.opts label{display:flex;align-items:center;gap:8px;font-size:13px}.opts input{width:18px;min-height:18px}.secHead{display:flex;gap:6px}.secHead input{flex:1}.row{display:grid;grid-template-columns:46px 1fr 88px 34px;gap:5px;margin-top:6px}.row input{padding:7px 5px}.btn{border:0;border-radius:9px;padding:11px 12px;font-weight:700;font-size:14px}.gray{background:#e9edf2}.red{background:#fee2e2;color:#991b1b}.wa{background:#25D366;color:#fff}.dark{background:#1f2937;color:#fff}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tools .btn{flex:1}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#fff;border-top:1px solid #ddd;z-index:20}.bar .btn{flex:1;min-height:52px}.previewbox{white-space:pre-wrap;font-size:15px;line-height:1.45;min-height:180px;background:#fcfcfd;border:1px dashed #cfd3d8;border-radius:10px;padding:12px}.hint{font-size:11px;color:#667085;margin-top:4px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:1}.row{grid-template-columns:42px 1fr 82px 34px}}</style></head><body><main><div class="topnav"><a href="mobile-pdf.html">PDF Quotation</a><a class="active" href="mobile-text.html">Text Quotation</a></div><div class="card"><div class="grid"><div><label>Customer Name</label><input id="customer"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Vehicle No.</label><input id="vehicle"></div><div><label>Mileage</label><input id="mileage"></div><div class="wide"><label>Model / Type</label><input id="model"></div><div class="wide"><label>WhatsApp No. <span style="font-weight:400">(optional)</span></label><input id="phone" inputmode="tel" placeholder="e.g. 91234567"><div class="hint">Leave blank to choose the contact in WhatsApp.</div></div></div></div><div class="card opts"><label><input id="gstOn" type="checkbox" checked> Include GST (9%)</label></div><h2>Quotation Sections</h2><div id="sections"></div><div class="tools"><button class="btn gray" onclick="addSection()">+ Section</button><button class="btn gray" onclick="clearAll()">New</button></div><div class="card"><h2>WhatsApp Text Preview</h2><div id="textPreview" class="previewbox"></div></div></main><div class="bar"><button class="btn wa" onclick="openWhatsApp()">WhatsApp</button><button class="btn dark" onclick="copyText()">Copy Text</button></div><script>const $=x=>document.getElementById(x),S=[],money=n=>n===''||n==null?'':Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function sec(){return{title:'REPAIR / SERVICE',items:[{q:1,d:'',p:''}]}}function addSection(){S.push(sec());render();upd()}function delS(i){S.splice(i,1);if(!S.length)S.push(sec());render();upd()}function addI(i){let a=S[i].items,q=a.length?a[a.length-1].q:1;a.push({q,d:'',p:''});render();setTimeout(()=>document.querySelector(`[data-d="${i}-${a.length-1}"]`)?.focus(),0);upd()}function delI(i,j){S[i].items.splice(j,1);if(!S[i].items.length)S[i].items.push({q:1,d:'',p:''});render();upd()}function key(e,i,j){if((e.key==='Enter'||e.key==='Tab')&&!e.shiftKey){e.preventDefault();let q=S[i].items[j].q;S[i].items.splice(j+1,0,{q,d:'',p:''});render();setTimeout(()=>document.querySelector(`[data-d="${i}-${j+1}"]`)?.focus(),0);upd()}}function render(){$('sections').innerHTML=S.map((s,i)=>`<div class="card"><div class="secHead"><input value="${esc(s.title)}" oninput="S[${i}].title=this.value;upd()"><button class="btn red" onclick="delS(${i})">×</button></div>${s.items.map((x,j)=>`<div class="row"><input type="number" value="${x.q}" oninput="S[${i}].items[${j}].q=this.value;upd()"><input data-d="${i}-${j}" value="${esc(x.d)}" placeholder="Description" oninput="S[${i}].items[${j}].d=this.value;upd()"><input type="number" step=".01" value="${x.p}" placeholder="Price" oninput="S[${i}].items[${j}].p=this.value;upd()" onkeydown="key(event,${i},${j})"><button class="btn red" onclick="delI(${i},${j})">×</button></div>`).join('')}<button class="btn gray" style="margin-top:8px" onclick="addI(${i})">+ Item</button></div>`).join('')}function totals(){let sub=0;S.forEach(s=>s.items.forEach(x=>{if(x.q!==''&&x.p!=='')sub+=(+x.q||0)*(+x.p||0)}));let g=gstOn.checked?sub*.09:0;return{sub,g,grand:sub+g}}function textQ(){let t=totals(),L=["*ALAN'S UNITED AUTO PTE. LTD.*","*QUOTATION*"];if(customer.value)L.push(`Customer: ${customer.value}`);if(vehicle.value)L.push(`Vehicle: ${vehicle.value}`);if(model.value)L.push(`Model: ${model.value}`);if(mileage.value)L.push(`Mileage: ${mileage.value}`);if(date.value)L.push(`Date: ${new Date(date.value+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`);L.push('');S.forEach(s=>{let st=0;L.push(`*${s.title.toUpperCase()}*`);s.items.forEach(x=>{if(!x.d&&!x.p)return;let a=x.q!==''&&x.p!==''?(+x.q||0)*(+x.p||0):null;if(a!=null)st+=a;L.push(`• ${x.q!==''?x.q+' x ':''}${x.d}${x.p!==''?' @ S$'+money(x.p):''}${a!=null?' = S$'+money(a):''}`)});if(st)L.push(`S$${money(st)}`);L.push('')});if(t.sub){L.push(`Subtotal: S$${money(t.sub)}`);if(gstOn.checked)L.push(`GST (9%): S$${money(t.g)}`);L.push(`*Grand Total: S$${money(t.grand)}*`)}L.push('','Quotation valid for 7 days.','Ad hoc items may be required.');return L.join('\n')}function upd(){textPreview.textContent=textQ()}function norm(v){let n=String(v||'').replace(/\D/g,'');if(!n)return'';return n.length===8?'65'+n:n}function openWhatsApp(){const n=norm(phone.value),u=n?`https://wa.me/${n}?text=${encodeURIComponent(textQ())}`:`https://wa.me/?text=${encodeURIComponent(textQ())}`;location.href=u}async function copyText(){try{await navigator.clipboard.writeText(textQ());alert('Quotation text copied.')}catch{alert('Unable to copy text on this browser.')}}function clearAll(){if(!confirm('Start a new quotation?'))return;customer.value=vehicle.value=mileage.value=model.value=phone.value='';date.value=new Date().toISOString().slice(0,10);S.splice(0,S.length,sec());render();upd()}[customer,date,vehicle,mileage,model,phone,gstOn].forEach(x=>x.addEventListener('input',upd));date.value=new Date().toISOString().slice(0,10);S.push(sec());render();upd();</script></body></html>
