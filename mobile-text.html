<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AUA WhatsApp Quotation</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;padding:10px 10px 90px;color:#181818}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:11px;margin-bottom:10px}input,select,textarea{width:100%;font:inherit;font-size:16px;min-height:44px;padding:9px;border:1px solid #cfd3d8;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.item{border:1px solid #e5e7eb;border-radius:9px;padding:8px;margin-top:7px}.row{display:grid;grid-template-columns:42px 1fr 80px 34px;gap:5px}.disc{display:grid;grid-template-columns:115px 1fr;gap:6px;margin-top:6px}.small{font-size:11px;color:#667085;margin-top:5px}.btn{border:0;border-radius:9px;padding:11px;font-weight:700}.gray{background:#e9edf2}.red{background:#fee2e2;color:#991b1b}.wa{background:#25D366;color:white}.dark{background:#1f2937;color:white}.bar{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1.2fr 1fr;gap:8px;background:#fff;border-top:1px solid #ddd;padding:10px}.preview{white-space:pre-wrap;line-height:1.45;font-size:15px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:1}}</style></head><body>
<div class="card"><div class="grid"><div><label>Customer</label><input id="customer"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Vehicle</label><input id="vehicle"></div><div><label>Mileage</label><input id="mileage"></div><div class="wide"><label>Model</label><input id="model"></div><div class="wide"><label>WhatsApp No.</label><input id="phone" inputmode="tel"></div></div></div>
<div class="card"><label><input id="gstOn" type="checkbox" checked style="width:auto;min-height:auto"> Include GST (9%)</label><div class="small">Overall discount — optional</div><div class="disc"><select id="overallType"><option value="percent">Percentage (%)</option><option value="dollar">Dollar (S$)</option></select><input id="overallDisc" type="number" min="0" step=".01" placeholder="No discount"></div></div>
<div id="sections"></div><button class="btn gray" onclick="addSection()">+ Section</button>
<div class="card"><b>WhatsApp Preview</b><div id="preview" class="preview"></div></div>
<div class="bar"><button class="btn wa" onclick="openWA()">Open WhatsApp</button><button class="btn dark" onclick="copyText()">Copy</button></div>
<script>
const $=x=>document.getElementById(x),S=[],money=n=>Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}),D=(b,t,v)=>Math.min(b,t==='percent'?b*Math.min(100,Math.max(0,+v||0))/100:Math.max(0,+v||0)),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function item(){return{q:1,d:'',p:'',dt:'percent',dv:''}}function sec(){return{title:'REPAIR / SERVICE',dt:'percent',dv:'',items:[item()]}}function addSection(){S.push(sec());render();upd()}function addI(i){S[i].items.push({...item(),q:S[i].items.at(-1)?.q??1});render();upd()}function delI(i,j){S[i].items.splice(j,1);if(!S[i].items.length)S[i].items.push(item());render();upd()}function delS(i){S.splice(i,1);if(!S.length)S.push(sec());render();upd()}
function render(){sections.innerHTML=S.map((s,i)=>`<div class="card"><input value="${esc(s.title)}" oninput="S[${i}].title=this.value;upd()">${s.items.map((x,j)=>`<div class="item"><div class="row"><input type="number" value="${x.q}" oninput="S[${i}].items[${j}].q=this.value;upd()"><input value="${esc(x.d)}" placeholder="Description" oninput="S[${i}].items[${j}].d=this.value;upd()"><input type="number" step=".01" value="${x.p}" placeholder="Price" oninput="S[${i}].items[${j}].p=this.value;upd()"><button class="btn red" onclick="delI(${i},${j})">×</button></div><div class="small">Item discount — optional</div><div class="disc"><select onchange="S[${i}].items[${j}].dt=this.value;upd()"><option value="percent" ${x.dt==='percent'?'selected':''}>Percentage (%)</option><option value="dollar" ${x.dt==='dollar'?'selected':''}>Dollar (S$)</option></select><input type="number" min="0" step=".01" value="${x.dv}" placeholder="No discount" oninput="S[${i}].items[${j}].dv=this.value;upd()"></div></div>`).join('')}<div class="small">Section discount — optional</div><div class="disc"><select onchange="S[${i}].dt=this.value;upd()"><option value="percent" ${s.dt==='percent'?'selected':''}>Percentage (%)</option><option value="dollar" ${s.dt==='dollar'?'selected':''}>Dollar (S$)</option></select><input type="number" min="0" step=".01" value="${s.dv}" placeholder="No discount" oninput="S[${i}].dv=this.value;upd()"></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn gray" onclick="addI(${i})">+ Item</button><button class="btn red" onclick="delS(${i})">Remove Section</button></div></div>`).join('')}
function totals(){let subtotal=0,secs=S.map(s=>{let gross=0,items=s.items.map(x=>{let base=(x.q!==''&&x.p!=='')?(+x.q||0)*(+x.p||0):0,disc=D(base,x.dt,x.dv),net=base-disc;gross+=net;return{...x,base,disc,net}});let sd=D(gross,s.dt,s.dv),net=gross-sd;subtotal+=net;return{s,items,gross,sd,net}});let od=D(subtotal,overallType.value,overallDisc.value),tax=subtotal-od,g=gstOn.checked?tax*.09:0;return{secs,subtotal,od,tax,g,grand:tax+g}}
function textQ(){vehicle.value=vehicle.value.toUpperCase();let t=totals(),L=["*ALAN'S UNITED AUTO PTE. LTD.*","*QUOTATION*"];if(customer.value)L.push(`Customer: ${customer.value}`);if(vehicle.value)L.push(`Vehicle: ${vehicle.value}`);if(model.value)L.push(`Model: ${model.value}`);if(mileage.value)L.push(`Mileage: ${mileage.value}`);if(date.value)L.push(`Date: ${new Date(date.value+'T00:00:00').toLocaleDateString('en-GB')}`);L.push('');t.secs.forEach(z=>{L.push(`*${z.s.title.toUpperCase()}*`);z.items.forEach(x=>{if(!x.d&&!x.p)return;let s=`• ${x.q} x ${x.d} @ S$${money(x.p)} = S$${money(x.base)}`;if(x.disc>0)s+=`\n  Item discount${x.dt==='percent'?` (${x.dv}%)`:''}: -S$${money(x.disc)}\n  Item total: S$${money(x.net)}`;L.push(s)});if(z.sd>0)L.push(`Section discount${z.s.dt==='percent'?` (${z.s.dv}%)`:''}: -S$${money(z.sd)}`);L.push(`Section total: S$${money(z.net)}`,'')});L.push(`Subtotal: S$${money(t.subtotal)}`);if(t.od>0)L.push(`Overall discount${overallType.value==='percent'?` (${overallDisc.value}%)`:''}: -S$${money(t.od)}`);if(gstOn.checked)L.push(`GST (9%): S$${money(t.g)}`);L.push(`*Grand Total: S$${money(t.grand)}*`,'','Quotation valid for 7 days.','Ad hoc items may be required.');return L.join('\n')}
function upd(){preview.textContent=textQ()}function norm(v){let n=String(v||'').replace(/\D/g,'');return n.length===8?'65'+n:n}function openWA(){let n=norm(phone.value),u=n?`https://wa.me/${n}?text=${encodeURIComponent(textQ())}`:`https://wa.me/?text=${encodeURIComponent(textQ())}`;location.href=u}async function copyText(){try{await navigator.clipboard.writeText(textQ());alert('Copied')}catch{}}[customer,date,vehicle,mileage,model,phone,gstOn,overallType,overallDisc].forEach(x=>x.addEventListener('input',upd));date.value=new Date().toISOString().slice(0,10);S.push(sec());render();upd();
</script></body></html>
